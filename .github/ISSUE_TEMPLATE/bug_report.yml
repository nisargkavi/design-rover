name: Bug report
description: Report behavior that you can reproduce.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Check existing issues and read the [contribution guide](https://github.com/nisargkavi/design-rover/blob/main/CONTRIBUTING.md).
        For a suspected vulnerability, follow the guide's security reporting instructions instead of posting details here.
  - type: input
    id: version
    attributes:
      label: Design Rover version
      description: Output from `bunx design-rover --version`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Bun version, Node version, operating system, and relevant framework or styling versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the exact command and the smallest source example or public reproduction that demonstrates the issue. Use temporary files rather than private project data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Describe both, including relevant output or errors. Redact private data.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already tried
      description: Optional commands, tests, or comparisons that help narrow down the problem.
  - type: checkboxes
    id: reporting_checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This public report contains no credentials, private project data, or undisclosed vulnerability details.
          required: true
