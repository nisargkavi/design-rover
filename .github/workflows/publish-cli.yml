name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resume_version:
        description: "Retry a tagged release, e.g. 0.3.2; select its v0.3.2 tag above. Leave empty for a normal main release."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/test.yml
  publish:
    needs: validate
    if: github.repository == 'nisargkavi/design-rover'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install the OIDC-capable npm CLI
        run: npm install --global npm@11.20.0 --ignore-scripts
      - run: bun install --frozen-lockfile
      - name: Publish the next semantic version, or resume a verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PACKAGES_TOKEN: ${{ github.token }}
          RESUME_VERSION: ${{ inputs.resume_version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ -n "$RESUME_VERSION" ]]; then
            [[ "$RESUME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$GITHUB_REF_NAME" == "v$RESUME_VERSION" ]] || { echo "Select the matching release tag when resuming."; exit 1; }
            node scripts/release-plugin.mjs resume "$RESUME_VERSION"
          else
            [[ "$GITHUB_REF_NAME" == "main" ]] || { echo "Normal releases run from main."; exit 1; }
            bun run release
          fi
